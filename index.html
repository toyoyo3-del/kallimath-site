<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <meta name="description" content="数学之美——在故事与游戏中亲手发现数学。">
  <title>数学之美 · 数量的语言</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button" id="homeButton" aria-label="返回章节首页" title="返回章节首页">
        <span aria-hidden="true">⌂</span>
      </button>
      <div class="brand">
        <span class="brand-leaf" aria-hidden="true">◆</span>
        <div>
          <strong>数学之美</strong>
          <small id="chapterLabel">一棵从好奇心长出的树</small>
        </div>
      </div>
      <button class="icon-button" id="soundButton" aria-label="关闭声音" title="打开或关闭声音">
        <span id="soundIcon" aria-hidden="true">♪</span>
      </button>
    </header>

    <main id="game" class="game" aria-live="polite"></main>

    <div class="progress-wrap" aria-label="本章进度">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span id="progressText">故事开始</span>
    </div>
  </div>

  <template id="rabbitTemplate">
    <button class="rabbit" type="button" aria-label="一只尚未清点的小兔子">
      <svg viewBox="0 0 86 96" role="img" aria-hidden="true">
        <ellipse class="rabbit-ear" cx="28" cy="23" rx="10" ry="23" transform="rotate(-8 28 23)"/>
        <ellipse class="rabbit-ear" cx="57" cy="23" rx="10" ry="23" transform="rotate(8 57 23)"/>
        <ellipse class="rabbit-ear-inner" cx="29" cy="22" rx="4" ry="15" transform="rotate(-8 29 22)"/>
        <ellipse class="rabbit-ear-inner" cx="56" cy="22" rx="4" ry="15" transform="rotate(8 56 22)"/>
        <circle class="rabbit-body" cx="43" cy="58" r="31"/>
        <circle class="rabbit-eye" cx="32" cy="53" r="3"/>
        <circle class="rabbit-eye" cx="55" cy="53" r="3"/>
        <path class="rabbit-nose" d="M39 62 Q43 66 47 62 Q43 59 39 62Z"/>
        <path class="rabbit-mouth" d="M43 65 Q39 70 36 67 M43 65 Q47 70 50 67"/>
      </svg>
      <span class="counted-mark">✓</span>
    </button>
  </template>

  <script src="game.js"></script>
</body>
</html>
